name: CI

on:
  push:
    branches: [main, develop, experiment/full-mvp-goal]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: ['21', '25']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java compatibility version
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: maven

      - name: Verify backend
        run: ./mvnw -B -ntp verify

      - name: Upload backend test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports-java-${{ matrix.java-version }}
          path: '**/target/surefire-reports/**'
          if-no-files-found: ignore
          retention-days: 14

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test -- --run

      - name: Lint frontend
        run: npm run lint

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Build frontend
        run: npm run build

  compose:
    name: Validate Compose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose file
        run: docker compose config --quiet

  acceptance:
    name: Integrated technical acceptance
    runs-on: ubuntu-latest
    needs: [backend, frontend, compose]
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: work-training-system-acceptance
      DEMO_ADMIN_EMAIL: admin@example.test
      DEMO_ADMIN_PASSWORD: ChangeMe-Admin-2026!
      DEMO_MANAGER_EMAIL: manager@example.test
      DEMO_MANAGER_PASSWORD: ChangeMe-Manager-2026!
      DEMO_EMPLOYEE_EMAIL: employee@example.test
      DEMO_EMPLOYEE_PASSWORD: ChangeMe-Employee-2026!
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Prepare acceptance evidence directory
        run: mkdir -p acceptance-artifacts

      - name: Verify toolchain
        shell: bash
        run: ./scripts/check-environment.sh

      - name: Start isolated Compose environment
        run: docker compose up --build --detach

      - name: Wait for application readiness
        shell: bash
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:8080/actuator/health/readiness >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color backend postgres minio mailpit
          exit 1

      - name: Seed acceptance data
        run: node scripts/acceptance/seed-demo.mjs

      - name: Run API smoke test
        run: node scripts/acceptance/smoke.mjs

      - name: Prove SMTP retry transition
        run: node scripts/acceptance/smtp-retry.mjs

      - name: Install Playwright browser
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run browser acceptance tests
        working-directory: frontend
        run: npm run e2e

      - name: Write acceptance manifest
        if: always()
        run: node scripts/acceptance/acceptance-manifest.mjs

      - name: Collect service logs on failure
        if: failure()
        continue-on-error: true
        run: |
          mkdir -p acceptance-artifacts
          docker compose ps > acceptance-artifacts/compose-ps.txt 2>&1 || true
          docker compose logs --no-color > acceptance-artifacts/compose.log 2>&1 || true

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: technical-acceptance-evidence
          path: |
            acceptance-artifacts/
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 30

      - name: Stop isolated Compose environment
        if: always()
        run: docker compose down --volumes --remove-orphans
