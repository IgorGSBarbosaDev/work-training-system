spring:
  application:
    name: work-training-system
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://localhost:5432/work_training_system}
    username: ${DB_USERNAME:work_training_system}
    password: ${DB_PASSWORD:work_training_system}
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    time-zone: UTC
  cache:
    type: caffeine
    caffeine:
      spec: ${CACHE_SPEC:maximumSize=1000,expireAfterWrite=10m}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    test-connection: false
    properties:
      mail.smtp:
        auth: ${MAIL_SMTP_AUTH:false}
        starttls.enable: ${MAIL_SMTP_STARTTLS:false}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

app:
  jwt:
    issuer: ${JWT_ISSUER:work-training-system}
    audience: ${JWT_AUDIENCE:work-training-system-api}
    signing-secret: ${JWT_SIGNING_SECRET:local-development-only-change-this-signing-secret}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:7d}
  identity:
    login-failure-threshold: ${LOGIN_FAILURE_THRESHOLD:5}
    login-lock-duration: ${LOGIN_LOCK_DURATION:15m}
    login-attempt-window: ${LOGIN_ATTEMPT_WINDOW:15m}
    password-reset-token-ttl: ${PASSWORD_RESET_TOKEN_TTL:30m}
    password-reset-url: ${PASSWORD_RESET_URL:http://localhost:5173/reset-password}
    bcrypt-strength: ${BCRYPT_STRENGTH:12}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  demo:
    enabled: ${DEMO_ENABLED:false}
    admin-email: ${DEMO_ADMIN_EMAIL:}
    admin-password: ${DEMO_ADMIN_PASSWORD:}
  storage:
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    public-endpoint: ${STORAGE_PUBLIC_ENDPOINT:http://localhost:9000}
    access-key: ${STORAGE_ACCESS_KEY:minioadmin}
    secret-key: ${STORAGE_SECRET_KEY:minioadmin123}
    bucket: ${STORAGE_BUCKET:work-training-system-private}
    region: ${STORAGE_REGION:us-east-1}
    upload-url-ttl: ${STORAGE_UPLOAD_URL_TTL:15m}
    download-url-ttl: ${STORAGE_DOWNLOAD_URL_TTL:15m}
    playback-url-ttl: ${STORAGE_PLAYBACK_URL_TTL:15m}
  progress:
    future-tolerance: ${PROGRESS_FUTURE_TOLERANCE:10s}
    max-event-age: ${PROGRESS_MAX_EVENT_AGE:5m}
    minimum-event-interval: ${PROGRESS_MINIMUM_EVENT_INTERVAL:1s}
    watched-tolerance-seconds: ${PROGRESS_WATCHED_TOLERANCE_SECONDS:2.0}
    maximum-playback-rate: ${PROGRESS_MAXIMUM_PLAYBACK_RATE:2.0}
    reported-percentage-tolerance: ${PROGRESS_REPORTED_PERCENTAGE_TOLERANCE:2.0}
  uploads:
    allow-legacy-object-keys: ${UPLOADS_ALLOW_LEGACY_OBJECT_KEYS:false}
    cleanup-delay: ${UPLOADS_CLEANUP_DELAY:5m}
  mail:
    from: ${MAIL_FROM:no-reply@localhost}
  qr:
    public-base-url: ${QR_PUBLIC_BASE_URL:http://localhost:5173}

logging:
  structured:
    format:
      console: ${LOGGING_STRUCTURED_FORMAT_CONSOLE:logstash}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
    operations-sorter: alpha
    tags-sorter: alpha
